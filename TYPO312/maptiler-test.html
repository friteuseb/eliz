<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapTiler Test Map</title>
    <!-- Inclure les styles de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Inclure le script de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        /* Définir une hauteur pour le conteneur de la carte */
        #map {
            height: 400px;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>Test MapTiler Map</h1>
    <div id="map"></div>

    <script>
        // Initialiser la carte
        const map = L.map('map').setView([43.639803, 7.140496], 14); // Centré sur Nice, France

        // Ajouter les tuiles MapTiler
        L.tileLayer('https://api.maptiler.com/maps/streets/{z}/{x}/{y}.png?key=zKyTbUjFLJcaP2tCI4ou', {
            attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">© MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">© OpenStreetMap contributors</a>'
        }).addTo(map);

        // Ajouter un marqueur
        L.marker([43.639803, 7.140496]).addTo(map)
            .bindPopup('Position à Nice, France')
            .openPopup();
    </script>
</body>
</html>
